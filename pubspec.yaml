name: rain_stay
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#007A87"
    theme_color: "#007A87"
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.webp
    - assets/logo1.webp
    - assets/icon.png
